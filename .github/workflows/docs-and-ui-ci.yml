name: Docs and UI CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  VALE_VERSION: 3.28.1

jobs:
  vale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Vale
        run: |
          curl -sSfL "https://github.com/vale-cli/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz" | tar -xz -C /usr/local/bin vale
          vale -v
      - run: npm ci
      - run: npm run lint:vale
      - run: npm test

  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint:md

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --config lychee.toml docs/*.md docs/foundation docs/patterns docs/components
          fail: true
